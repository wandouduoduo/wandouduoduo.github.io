# Hexo Configuration
## Docs: https://hexo.io/docs/configuration.html
## Source: https://github.com/hexojs/hexo/

# Site
title: 运维随笔
subtitle: SRE & Devops & Architect
description: 资深运维架构师豌豆多多的呕心笔记
keywords: 运维随笔,运维,yunwei,豌豆,wandou,笔记,note,自动化,工具,DevOps,工程师,Linux,Shell,数据库,互联网,k8s,docker,云计算,python,程序员,虚拟化,AI,人工智能,大模型,LLM
author: 豌豆多多
language: zh-CN
timezone: Asia/Shanghai

# URL
## If your site is put in a subdirectory, set url as 'http://yoursite.com/child' and root as '/child/'
url: https://wandouduoduo.github.io
root: /
#permalink: :year/:month/:day/:title/
#permalink_defaults:
permalink: articles/:abbrlink.html
abbrlink:
  alg: crc32  # 算法：crc16(default) and crc32
  rep: hex    # 进制：dec(default) and hex

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render: 
  - 'google25bff695acced0bf.html'
  - 'tools/*'

# Writing
new_post_name: :title.md # File name of new posts
default_layout: post
titlecase: false # Transform title into titlecase
external_link: true # Open external links in new tab
filename_case: 0
render_drafts: false
post_asset_folder: true
relative_link: false
future: true
highlight:
  enable: true
  line_number: true
  auto_detect: false
  tab_replace:
  
# Home page setting
# path: Root path for your blogs index page. (default = '')
# per_page: Posts displayed per page. (0 = disable pagination)
# order_by: Posts order. (Order by date descending by default)
index_generator:
  path: ''
  per_page: 10
  order_by: -date
  
# Category & Tag
default_category: uncategorized
category_map:
tag_map:

# Date / Time format
## Hexo uses Moment.js to parse and display date
## You can customize the date format as defined in
## http://momentjs.com/docs/#/displaying/format/
date_format: YYYY-MM-DD
time_format: HH:mm:ss

# Pagination
## Set per_page to 0 to disable pagination
per_page: 10
pagination_dir: page

# sitemap
sitemap:
  path: sitemap.xml
baidusitemap:
  path: baidusitemap.xml

# Extensions
## Plugins: https://hexo.io/plugins/
Plugins: hexo-generate-feed
## Themes: https://hexo.io/themes/
#theme: landscape
#theme: concise
theme: next

symbols_count_time:
 #文章内是否显示
  symbols: true
  time: true
 # 网页底部是否显示
  total_symbols: true
  total_time: true

baidu_url_submit:
  count: 200 ## 比如3，代表提交最新的三个链接
  host: wandouduoduo.github.io ## 在百度站长平台中注册的域名
  token: 2U3NKVcqUGdR2dZr ## 请注意这是您的秘钥， 请不要发布在公众仓库里!
  path: baidu_urls.txt ## 文本文档的地址， 新链接会保存在此文本文档里

live2d:
  enable: true
  scriptFrom: local
  pluginRootPath: live2dw/
  pluginJsPath: lib/
  pluginModelPath: assets/
  tagMode: false
  debug: false
  model:
    #use: https://cdn.jsdelivr.net/gh/wandouduoduo/wandouduoduo.github.io@v1.0/live2dw/assets/shizuku.model.json
    use: live2d-widget-model-shizuku
  display:
    position: right
    width: 150
    height: 300
  mobile:
    show: true

# hexo-tag-cloud
tag_cloud:
    textFont: Trebuchet MS, Helvetica
    textColor: '#333'
    textHeight: 25
    outlineColor: '#E2E1D1'
    maxSpeed: 0.1
    pauseOnSelected: false


nofollow:
  enable: true
  field: site
  exclude:
    - 'wandouduoduo.github.io'
    - 'wandouduoduo.gitee.io'
    - 'wandouduoduo.netlify.com'

#readmore
#plugins:
readmore:
  enable: true
  blogId: 59497-4326679676988-167
  name: 运维随笔
  qrcode: https://wandouduoduo.github.io/about/index/gongzhonghao.jpg
  keyword: vip
  # 自定义的 JS 资源链接，可用于 CDN 加速
  libUrl: 'https://qiniu.techgrow.cn/readmore/dist/readmore.js'
  # 自定义的 CSS 资源链接，可用于适配不同风格的博客
  cssUrl: 'https://qiniu.techgrow.cn/readmore/dist/hexo.css'
  # 命令行终端是否输出日志信息
  debug: true
  # 文章内容的预览高度（例如 300）
  height: 'auto'
  # 文章解锁后凭证的有效天数
  expires: 7
  # 定时校验凭证有效性的时间间隔（秒）
  interval: 60
  # 是否添加微信公众号引流工具到移动端页面
  allowMobile: false
  # 获取文章主体内容的 JS 选择器，在博客启用了 Pjax 的情况下才需要根据不同的主题进行配置
  pjaxSelector: ''
  # Pjax 支持重载的 Css 类名（例如 'pjax'），在博客启用了 Pjax 的情况下才需要根据不同的主题进行配置
  pjaxCssClass: ''
  # 每篇文章随机添加微信公众号引流工具的概率，有效范围在 0.1 ~ 1 之间，1 则表示所有文章默认都自动添加引流工具
  random: 1 

# Deployment
## Docs: https://hexo.io/docs/deployment.html
deploy:
- type: git
  repo: 
    github: git@github.com:wandouduoduo/wandouduoduo.github.io.git
    #gitee: git@gitee.com:wandouduoduo/wandouduoduo.git
  branch: master
- type: baidu_url_submitter
